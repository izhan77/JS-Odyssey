<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- <section class="active" id="welcome_page">
      <h1>Quiz App</h1>
      <button id="start_btn">Start</button>
    </section> -->

    <section class="hidden" id="questions_page">
      <div class="progress">1 / 10</div>
      <div class="question question1">Which Pakistani city is known as the “City of Saints” because of its many Sufi shrines?</div>
      <div class="timer">
        <div class="bar-time">
          <div class="bar"></div>
          <div class="time">15:00</div>
        </div>
      </div>
      <div class="options">
        <div class="option" id="option1">
          <div>A.</div>
          <div>Lahore</div>
          <div></div>
        </div>
        <div class="option" id="option2">
          <div>B.</div>
          <div>Multan</div>
          <div></div>
        </div>
        <div class="option" id="option3">
          <div>C.</div>
          <div>Peshawar</div>
          <div></div>
        </div>
        <div class="option" id="option4">
          <div>D.</div>
          <div>Hyderabad</div>
          <div></div>
        </div>
      </div>
      <div class="check-btn">
        <button id="check">Check</button>
      </div>
      <div class="next-btn">
        <button id="next">Next</button>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
